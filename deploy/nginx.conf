# MathsView sur le Raspberry Pi.
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/mathsview
#   sudo ln -sf /etc/nginx/sites-available/mathsview /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mathsview.local _;

    root /var/www/mathsview;
    index index.html;

    # Le stockage de la progression (serveur/mathsview_api.py, via systemd).
    # Même origine que le site : rien à configurer côté navigateur.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Le journal d'un élève peut peser une centaine de Ko.
        client_max_body_size 8m;
        # Une écriture ne doit jamais faire attendre un enfant : si le service
        # ne répond pas, on échoue vite et le site bascule en mode local.
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Les leçons et les générateurs changent à chaque push : on force la
    # revalidation plutôt que de laisser un navigateur servir la version d'hier.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Les bibliothèques embarquées, elles, ne bougent jamais.
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # La base n'est pas là (elle est dans /var/lib/mathsview), mais on ferme
    # quand même la porte : ce dossier ne contient que du code serveur.
    location /serveur/ { return 404; }
}
