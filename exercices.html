<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MathsView — Entraînement</title>
  <link rel="stylesheet" href="vendor/jsxgraph.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/exos.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">△</span>
      <div>
        <h1>Entraînement</h1>
        <p class="tagline">Des exercices générés, avec leur correction</p>
      </div>
    </div>
    <div class="filters">
      <span id="profil-actif"></span>
      <a class="exo-lien-lecons" href="index.html">← Retour aux leçons</a>
    </div>
  </header>

  <main class="content exo-content">
    <section id="accueil"></section>
    <section id="session" hidden></section>
  </main>

  <!-- Bibliothèques (locales, hors-ligne) -->
  <script src="vendor/jsxgraphcore.js"></script>
  <script src="vendor/tex-svg.js" id="MathJax-script"></script>

  <!-- Le moteur des leçons : les générateurs « Fonctions » consomment son pool.
       Rien n'est démarré ici (pas de MathsView.start()). -->
  <script src="js/app.js"></script>
  <script src="js/python-mini.js"></script>
  <script src="js/python-console.js"></script>
  <script src="js/fonctions-base.js"></script>

  <!-- Le module exercices -->
  <script src="js/alea.js"></script>
  <script src="js/reponse.js"></script>
  <script src="js/profils.js"></script>
  <script src="js/sync-ui.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/profil-bandeau.js"></script>
  <script src="js/exos-base.js"></script>
  <script src="js/trophees.js"></script>
  <script src="js/boutique.js"></script>
  <script src="js/defis.js"></script>
  <script src="js/flash.js"></script>
  <script src="exos/catalogue.js"></script>

  <!-- Les générateurs. `outils.js` d'abord : les fn-*.js s'en servent. -->
  <script src="exos/fonctions/outils.js"></script>
  <script src="exos/fonctions/fn-image.js"></script>
  <script src="exos/fonctions/fn-domaine.js"></script>
  <script src="exos/fonctions/fn-resolution.js"></script>
  <script src="exos/fonctions/fn-parite.js"></script>
  <script src="exos/2nde/ensembles-nombres.js"></script>
  <script src="exos/2nde/intervalles.js"></script>
  <script src="exos/2nde/encadrement-decimal.js"></script>
  <script src="exos/2nde/valeur-absolue.js"></script>

  <!-- Générateurs « classiques » par niveau (SPEC §4). -->
  <script src="exos/outils.js"></script>
  <script src="exos/repere-outils.js"></script>
  <!-- Un repère à deux échelles, pour les grandeurs : même règle que
       repere-outils.js, il précède les générateurs qui s'en servent. -->
  <script src="exos/graphique-outils.js"></script>
  <script src="exos/instruments.js"></script>
  <script src="exos/6eme/tables.js"></script>
  <script src="exos/6eme/additions-20.js"></script>
  <script src="exos/6eme/divisibilite.js"></script>
  <script src="exos/6eme/fractions.js"></script>
  <script src="exos/6eme/mult-div-10.js"></script>
  <script src="exos/6eme/perimetres.js"></script>
  <script src="exos/6eme/aires.js"></script>
  <script src="exos/6eme/conversions.js"></script>
  <script src="exos/6eme/quadrilateres.js"></script>
  <script src="exos/6eme/geo-outils.js"></script>
  <script src="exos/6eme/angles.js"></script>
  <script src="exos/6eme/perp-para.js"></script>
  <script src="exos/6eme/symetrie-axiale.js"></script>
  <script src="exos/6eme/compas.js"></script>
  <script src="exos/5eme/relatifs.js"></script>
  <script src="exos/5eme/comparaison.js"></script>
  <script src="exos/5eme/somme-relatifs.js"></script>

  <script src="exos/5eme/comparer-fractions.js"></script>
  <script src="exos/5eme/fraction-pourcentage.js"></script>
  <script src="exos/5eme/proportions.js"></script>
  <script src="exos/5eme/proportionnalite-graphique.js"></script>
  <script src="exos/5eme/probabilites-vocabulaire.js"></script>
  <script src="exos/5eme/puissances.js"></script>
  <script src="exos/5eme/priorites.js"></script>
  <script src="exos/5eme/substitution.js"></script>
  <script src="exos/5eme/distributivite.js"></script>
  <script src="exos/5eme/volumes.js"></script>
  <script src="exos/5eme/angles-paralleles.js"></script>
  <script src="exos/5eme/triangle-outils.js"></script>
  <script src="exos/5eme/somme-angles.js"></script>
  <script src="exos/5eme/construire-triangles.js"></script>
  <script src="exos/5eme/hauteurs.js"></script>
  <script src="exos/5eme/medianes.js"></script>
  <script src="exos/5eme/mediatrices.js"></script>
  <script src="exos/5eme/reperage.js"></script>
  <script src="exos/5eme/symetrie-centrale.js"></script>
  <script src="exos/4eme/pythagore.js"></script>
  <script src="exos/4eme/equations.js"></script>
  <script src="exos/3eme/identites.js"></script>
  <script src="exos/3eme/thales.js"></script>
  <script src="exos/3eme/trigonometrie.js"></script>
  <script src="exos/3eme/fonction-affine.js"></script>
  <!-- Vecteurs (2nde) : `vecteurs-outils.js` d'abord, comme exos/outils.js. -->
  <script src="exos/2nde/variations.js"></script>
  <script src="exos/2nde/vecteurs-outils.js"></script>
  <script src="exos/2nde/vecteurs-egalite.js"></script>
  <script src="exos/2nde/vecteurs-coordonnees.js"></script>
  <script src="exos/2nde/vecteurs-somme.js"></script>
  <script src="exos/2nde/vecteurs-colinearite.js"></script>
  <script src="exos/2nde/vecteurs-determinant.js"></script>
  <script src="exos/2nde/vecteurs-translation.js"></script>

  <script>
  /* ---------------------------------------------------------------------
     La page. Trois écrans, et un routage minimal :
        #profils        choisir (ou créer) un profil
        #accueil        le jardin, et la liste des entraînements
        #exo/<id>       une série sur un générateur
        #chap/<code>    une série mixte sur tout un chapitre
        #revision       « Arroser mon jardin » : le moteur choisit les
                        compétences qui ont le plus fané
        #flash          la séance des fondamentaux, chronométrée (js/flash.js)
     --------------------------------------------------------------------- */
  (function () {
    'use strict';

    var NIVEAUX = { '6eme': '6ème', '5eme': '5ème', '4eme': '4ème', '3eme': '3ème',
                    '2nde': '2nde', '1ere': '1ère', 'terminale': 'Terminale' };
    var BADGE = { '6eme': 'n6', '5eme': 'n5', '4eme': 'n4', '3eme': 'n3',
                  '2nde': 'n2', '1ere': 'n1', 'terminale': 'nt' };
    /* Un code sans libellé s'affiche tel quel — « geometrie-5e » en titre de
       section. La table doit donc couvrir TOUS les codes du catalogue. */
    var CHAPITRES = {
      fonctions: 'Fonctions', 'fonctions-3e': 'Fonctions',
      nombres: 'Nombres et ensembles',
      'calcul-mental': 'Calcul mental', 'nombres-6e': 'Nombres et calculs',
      grandeurs: 'Grandeurs et mesures',
      'calcul-5e': 'Calculs', litteral: 'Calcul littéral', geometrie: 'Géométrie',
      'geometrie-5e': 'Géométrie', 'geometrie-6e': 'Géométrie',
      'espace-5e': 'Géométrie dans l\'espace', vecteurs: 'Vecteurs',
      'donnees-5e': 'Données et hasard'
    };
    // L'état de la plante, de la graine à la fleur.
    var POUSSE = ['🌰', '🌱', '🌿', '🌷', '🌻'];

    var accueil = document.getElementById('accueil');
    var session = document.getElementById('session');
    var bandeauProfil = document.getElementById('profil-actif');

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function el(tag, cls, html) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html !== undefined) e.innerHTML = html;
      return e;
    }

    /* ================================================================= */
    /* Le bandeau du haut : qui travaille                                */
    /* Il est commun aux trois pages (js/profil-bandeau.js) ; ici on se   */
    /* contente de le monter et de le rafraîchir.                        */
    /* ================================================================= */
    MathsBandeau.monte(bandeauProfil);
    function majBandeau() { MathsBandeau.maj(); }

    /* ================================================================= */
    /* Écran « profils »                                                 */
    /* ================================================================= */
    function rendreProfils() {
      session.hidden = true;
      accueil.hidden = false;
      accueil.innerHTML = '';

      // Un profil archivé reste dans l'admin, mais n'apparaît plus ici.
      var liste = MathsProfils.profils().filter(function (p) { return !p.archive; });
      accueil.appendChild(el('div', 'exo-intro',
        '<h2>' + (liste.length ? 'Qui travaille ?' : 'Bienvenue !') + '</h2>' +
        '<p>' + (liste.length
          ? 'Chaque profil garde sa propre progression : ses ceintures, son jardin, ses points.'
          : 'Commence par créer un profil. Il gardera ta progression sur cet ordinateur.') +
        '</p>'));

      var grille = el('div', 'exo-profils');
      liste.forEach(function (p) {
        var r = MathsProgression.resume(p.id);
        var c = el('button', 'exo-profil-carte');
        c.innerHTML =
          '<span class="exo-avatar grand" style="background:' + p.couleur + '">' +
            p.emoji + '</span>' +
          '<span class="exo-profil-nom">' + esc(p.prenom) + '</span>' +
          '<span class="exo-profil-info">' + r.xp + ' XP · ' +
            r.travaillees + '/' + r.total + ' compétences</span>';
        c.onclick = function () {
          MathsProfils.setCourant(p.id);
          location.hash = 'accueil';
        };
        grille.appendChild(c);
      });

      var plus = el('button', 'exo-profil-carte nouveau',
        '<span class="exo-avatar grand">+</span>' +
        '<span class="exo-profil-nom">Nouveau profil</span>');
      plus.onclick = function () { formulaireProfil(); };
      grille.appendChild(plus);
      accueil.appendChild(grille);

      if (liste.length) accueil.appendChild(blocSauvegarde());
    }

    function formulaireProfil() {
      var boite = el('div', 'exo-carte exo-form');
      boite.innerHTML =
        '<div class="props-label">Nouveau profil</div>' +
        '<label>Prénom <input id="np-prenom" class="exo-champ" maxlength="20"></label>' +
        '<div class="props-label">Emoji</div><div id="np-emojis" class="exo-choix-emoji"></div>' +
        '<div class="props-label">Couleur</div><div id="np-couleurs" class="exo-choix-couleur"></div>' +
        '<div class="props-label">Niveau</div>' +
        '<select id="np-niveau" class="exo-select"></select>';
      accueil.appendChild(boite);

      var choix = { emoji: MathsProfils.emojis[0], couleur: MathsProfils.couleurs[0] };
      var ze = document.getElementById('np-emojis');
      MathsProfils.emojis.forEach(function (e, i) {
        var b = el('button', 'exo-pastille-choix' + (i === 0 ? ' on' : ''), e);
        b.onclick = function () {
          choix.emoji = e;
          Array.prototype.forEach.call(ze.children, function (x) { x.classList.remove('on'); });
          b.classList.add('on');
        };
        ze.appendChild(b);
      });
      var zc = document.getElementById('np-couleurs');
      MathsProfils.couleurs.forEach(function (c, i) {
        var b = el('button', 'exo-pastille-choix couleur' + (i === 0 ? ' on' : ''), '');
        b.style.background = c;
        b.onclick = function () {
          choix.couleur = c;
          Array.prototype.forEach.call(zc.children, function (x) { x.classList.remove('on'); });
          b.classList.add('on');
        };
        zc.appendChild(b);
      });
      var sel = document.getElementById('np-niveau');
      Object.keys(NIVEAUX).forEach(function (k) {
        var o = document.createElement('option');
        o.value = k; o.textContent = NIVEAUX[k];
        if (k === '2nde') o.selected = true;
        sel.appendChild(o);
      });

      var actions = el('div', 'exo-actions');
      var ok = el('button', 'exo-btn primaire', 'Créer ce profil');
      ok.onclick = function () {
        var prenom = (document.getElementById('np-prenom').value || '').trim();
        if (!prenom) { document.getElementById('np-prenom').focus(); return; }
        var p = MathsProfils.creer({
          prenom: prenom, emoji: choix.emoji, couleur: choix.couleur,
          niveau: sel.value
        });
        MathsProfils.setCourant(p.id);
        location.hash = 'accueil';
        router();
      };
      actions.appendChild(ok);
      var annule = el('button', 'exo-btn', 'Annuler');
      annule.onclick = rendreProfils;
      actions.appendChild(annule);
      boite.appendChild(actions);
      document.getElementById('np-prenom').focus();
    }

    /* ================================================================= */
    /* Écran d'accueil : le jardin, puis les entraînements               */
    /* ================================================================= */
    function rendreAccueil() {
      var id = MathsProfils.courant();
      if (!id || !MathsProfils.profil(id)) { rendreProfils(); return; }

      session.hidden = true;
      accueil.hidden = false;
      accueil.innerHTML = '';
      majBandeau();

      var p = MathsProfils.profil(id);
      var jardin = MathsProgression.jardin(id);
      var r = MathsProgression.resume(id);

      accueil.appendChild(el('div', 'exo-intro',
        '<h2>Bonjour ' + esc(p.prenom) + ' !</h2>' +
        '<p>' + (r.travaillees === 0
          ? 'Ton jardin est encore vide : chaque compétence travaillée y fait pousser une plante.'
          : 'Ton jardin compte <b>' + r.travaillees + '</b> plante' +
            (r.travaillees > 1 ? 's' : '') + ' sur ' + r.total + '.' +
            (r.aArroser ? ' <b>' + r.aArroser + '</b> ' +
              (r.aArroser > 1 ? 'ont' : 'a') + ' besoin d\'être arrosée' +
              (r.aArroser > 1 ? 's' : '') + '.'
             : ' Tout est bien arrosé.')) + '</p>'));

      /* --- les fondamentaux ------------------------------------------- */
      /* Tables et additions ne se comprennent pas, elles s'automatisent : la
         séance flash est donc POUSSÉE, et non pas attendue d'un clic dans une
         liste. Elle reste refusable — proposée en haut de page, jamais
         imposée. */
      if (window.MathsFlash && MathsFlash.doitProposer(id)) {
        var j = MathsFlash.joursDepuis(id);
        var carte = el('div', 'fl-appel');
        carte.innerHTML =
          '<div class="fl-appel-txt"><b>⚡ Flash — les fondamentaux</b>' +
          '<span>' + (j === null
            ? 'Tables et additions : 20 questions chronométrées, environ deux minutes.'
            : 'Dernière séance il y a ' + j + ' jour' + (j > 1 ? 's' : '') +
              '. 20 questions, environ deux minutes.') + '</span></div>';
        var bF = el('button', 'exo-btn primaire', 'Commencer');
        bF.onclick = function () { location.hash = 'flash'; };
        var bP = el('button', 'exo-btn', 'Plus tard');
        bP.onclick = function () { carte.remove(); };
        var actF = el('div', 'fl-appel-btn');
        actF.appendChild(bF); actF.appendChild(bP);
        carte.appendChild(actF);
        accueil.appendChild(carte);
      }

      // Le bouton principal de la page (SPEC §5.3).
      var haut = el('div', 'exo-actions');
      var arroser = el('button', 'exo-btn primaire exo-arroser',
        '💧 Arroser mon jardin');
      arroser.onclick = function () { location.hash = 'revision'; };
      haut.appendChild(arroser);
      var bBoutique = el('button', 'exo-btn exo-arroser',
        '🪙 Boutique (' + r.pieces + ' pièces)');
      bBoutique.onclick = function () { location.hash = 'boutique'; };
      haut.appendChild(bBoutique);
      accueil.appendChild(haut);

      /* --- l'automatisme, à côté du jardin mais distinct de lui -------- */
      /* Deux mesures, deux jauges. Le jardin dit « est-ce que je comprends »,
         celle-ci « est-ce que je sais par cœur ». Les mélanger rendrait les
         deux illisibles. */
      if (window.MathsFlash && MathsFlash.sources().length) {
        var rf = MathsFlash.resume(id);
        if (rf.vus) {
          accueil.appendChild(el('div', 'home-cat', 'Mes automatismes'));
          var boiteF = el('div', 'fl-jauges');
          rf.comps.forEach(function (c) {
            boiteF.appendChild(el('div', 'fl-ligne',
              '<div class="fl-nom">' + esc(c.libelle) + '</div>' +
              '<div class="fl-barre"><div class="fl-jauge" style="width:' + c.pct +
                '%"></div></div>' +
              '<div class="fl-val">' + (Math.round(c.moyenne * 10) / 10).toString()
                .replace('.', ',') + ' pt · ' + c.vus + '/' + c.total + ' vus</div>'));
          });
          var lien = el('button', 'exo-btn fl-relancer', '⚡ Séance flash');
          lien.onclick = function () { location.hash = 'flash'; };
          boiteF.appendChild(lien);
          accueil.appendChild(boiteF);
        }
      }

      /* --- le jardin ------------------------------------------------- */
      accueil.appendChild(el('div', 'home-cat', 'Mon jardin'));
      var g = el('div', 'exo-jardin');
      jardin.slice().sort(function (a, b) { return b.besoin - a.besoin; })
        .forEach(function (c) {
          var carte = el('div', 'exo-plante' + (c.jamais ? ' vierge' : '') +
                                (c.besoin > 5 ? ' assoiffee' : ''));
          carte.innerHTML =
            '<div class="exo-plante-haut">' +
              '<span class="exo-pousse">' + POUSSE[c.pousse] + '</span>' +
              '<span class="exo-belt" style="background:' + c.ceinture.couleur +
                ';color:' + c.ceinture.encre + '">' + c.ceinture.nom +
                (c.ceinture.aEntretenir ? ' <i title="à entretenir">•</i>' : '') +
              '</span>' +
            '</div>' +
            '<div class="exo-plante-nom">' + esc(c.libelle) + '</div>' +
            '<div class="exo-comp-jauge"><i style="width:' + c.score + '%"></i></div>' +
            '<div class="exo-plante-info">' +
              (c.jamais ? 'jamais travaillée'
                        : c.score + '/100 · palier ' + c.palier + ' · ' +
                          (c.jours === 0 ? 'aujourd\'hui' :
                           c.jours === 1 ? 'hier' : 'il y a ' + c.jours + ' jours')) +
            '</div>';
          carte.onclick = function () { location.hash = 'comp/' + c.code; };
          g.appendChild(carte);
        });
      accueil.appendChild(g);

      /* --- les entraînements ----------------------------------------- */
      var gens = MathsExos.liste();
      Object.keys(NIVEAUX).forEach(function (niv) {
        var duNiveau = gens.filter(function (x) { return x.level === niv; });
        if (!duNiveau.length) return;

        var t = el('h3', 'home-level',
          '<span class="badge ' + BADGE[niv] + '">' + NIVEAUX[niv] + '</span>');
        accueil.appendChild(t);

        var chaps = [];
        duNiveau.forEach(function (x) {
          var c = MathsExos.competence(x.competence).chapitre || 'autres';
          if (chaps.indexOf(c) < 0) chaps.push(c);
        });
        chaps.forEach(function (c) {
          var dedans = duNiveau.filter(function (x) {
            return (MathsExos.competence(x.competence).chapitre || 'autres') === c;
          });
          var boss = MathsProgression.bossEtat(id, c);
          var ct = el('div', 'home-cat', esc(CHAPITRES[c] || c) +
            (dedans.length > 1
              ? ' <button class="exo-mixte" data-chap="' + esc(c) + '">' +
                'Série mixte (10 questions)</button>' : '') +
            (boss.ouvert
              ? ' <button class="exo-mixte boss" data-boss="' + esc(c) + '">🛡️ Boss' +
                (boss.fait && boss.fait.reussi ? ' — chapitre validé ✓' : '') + '</button>'
              : ' <span class="exo-boss-verrou" title="' +
                esc('Il faut la ceinture verte partout : ' + boss.manque.join(', ')) +
                '">🔒 boss</span>'));
          accueil.appendChild(ct);

          var grille = el('div', 'cards-grid');
          dedans.forEach(function (x) {
            var m = MathsProgression.maitrise(id, x.competence);
            var cei = MathsProgression.ceintureAffichee(m);
            var carte = el('div', 'card exo-card');
            carte.onclick = function () { location.hash = 'exo/' + x.id; };
            carte.innerHTML =
              '<span class="cat-chip calcul">' +
                esc(MathsExos.competence(x.competence).libelle) + '</span>' +
              '<h3>' + esc(x.titre) + '</h3>' +
              '<p class="exo-paliers">' +
                '<span class="exo-belt" style="background:' + cei.couleur +
                  ';color:' + cei.encre + '">' + cei.nom + '</span> ' +
                (m.tentatives ? Math.round(m.score) + '/100 · palier ' + m.palier
                              : 'jamais travaillé') + '</p>';
            grille.appendChild(carte);
          });
          accueil.appendChild(grille);
        });
      });

      Array.prototype.forEach.call(accueil.querySelectorAll('.exo-mixte'), function (b) {
        b.onclick = function (e) {
          e.stopPropagation();
          location.hash = (b.dataset.boss ? 'boss/' + b.dataset.boss
                                          : 'chap/' + b.dataset.chap);
        };
      });

      accueil.appendChild(blocFamille(id));
      accueil.appendChild(blocDefis(id));
      accueil.appendChild(blocTrophees(id));
      accueil.appendChild(blocSauvegarde());
    }

    /* ================================================================= */
    /* L'objectif commun et le classement (§10).                          */
    /*                                                                    */
    /* Deux principes tenus ici : le classement est en POINTS DE           */
    /* PROGRESSION, chacune sur son propre programme — jamais en score     */
    /* absolu, ce qui serait injuste entre une 6ème et une 2nde ; et       */
    /* l'objectif commun n'est atteint que si TOUTES y arrivent.           */
    /* ================================================================= */
    function blocFamille(id) {
      var bloc = el('div', 'exo-famille');
      var o = MathsDefis.etatObjectif();
      if (o.lignes.length < 2) return bloc;          // seule, ça n'a pas de sens

      bloc.appendChild(el('div', 'home-cat', 'Toutes ensemble'));
      var obj = el('div', 'exo-objectif' + (o.atteint ? ' atteint' : ''));
      var lignes = o.lignes.map(function (l) {
        return '<span class="exo-obj-ligne' + (l.atteint ? ' ok' : '') + '">' +
          '<span class="exo-avatar" style="background:' + l.profil.couleur + '">' +
          l.profil.emoji + '</span>' + esc(l.profil.prenom) + ' ' +
          Math.min(l.series, o.cible) + '/' + o.cible + '</span>';
      }).join('');
      obj.innerHTML =
        '<b>Objectif commun : ' + o.cible + ' séries chacune cette semaine</b>' +
        '<div class="exo-obj-lignes">' + lignes + '</div>' +
        (o.atteint
          ? '<div class="exo-obj-gagne">🎉 Objectif atteint par tout le monde : ' +
            esc(o.recompense) + ' !</div>'
          : '<div class="adm-note">Il faut que <b>chacune</b> y arrive — ' +
            'récompense : ' + esc(o.recompense) + '</div>');
      bloc.appendChild(obj);

      var cl = MathsDefis.classement();
      var t = el('div', 'exo-classement');
      t.innerHTML = '<div class="adm-note">Progression de la semaine, chacune sur ' +
        'son propre programme :</div>';
      var max = Math.max(1, cl[0] ? cl[0].pourcent : 1);
      cl.forEach(function (x, i) {
        t.innerHTML += '<div class="exo-classement-ligne">' +
          '<span class="exo-rang">' + (i + 1) + '</span>' +
          '<span class="exo-avatar" style="background:' + x.profil.couleur + '">' +
            x.profil.emoji + '</span>' +
          '<span class="exo-cl-nom">' + esc(x.profil.prenom) + '</span>' +
          '<span class="exo-comp-jauge"><i style="width:' +
            Math.round(100 * x.pourcent / max) + '%"></i></span>' +
          '<span class="exo-comp-score">+' + x.pourcent + ' pts</span></div>';
      });
      bloc.appendChild(t);
      return bloc;
    }

    /* ================================================================= */
    /* Les défis : la série est tirée au palier de la DÉFIÉE.             */
    /* ================================================================= */
    function blocDefis(id) {
      var bloc = el('div', 'exo-defis-bloc');
      var autres = MathsProfils.profils().filter(function (p) {
        return !p.archive && p.id !== id;
      });
      if (!autres.length) return bloc;

      bloc.appendChild(el('div', 'home-cat', 'Défis'));
      var mes = MathsDefis.defisDe(id);
      if (!mes.length) {
        bloc.appendChild(el('p', 'adm-note', 'Aucun défi pour l\'instant.'));
      }
      mes.slice(0, 6).forEach(function (d) {
        var moiDefie = d.vers === id;
        var autre = MathsProfils.profil(moiDefie ? d.de : d.vers);
        var l = el('div', 'exo-defi ' + d.statut);
        var quoi = MathsExos.competence(d.comp).libelle;
        var etat;
        if (d.statut === 'termine') {
          etat = d.gagnant === id ? '⚔️ gagné' : 'perdu';
        } else if (moiDefie) {
          etat = 'à relever';
        } else {
          etat = d.scoreDe === null ? 'à jouer de ton côté' : 'en attente de ' +
                 esc(autre ? autre.prenom : '');
        }
        l.innerHTML = '<b>' + esc(quoi) + '</b> — ' +
          (moiDefie ? 'défi de ' : 'tu défies ') +
          esc(autre ? autre.prenom : '?') + ' · mise ' + d.mise +
          ' pièces <span>' + etat + '</span>';
        var jouable = d.statut === 'lance' &&
          ((moiDefie) || (d.de === id && d.scoreDe === null));
        if (jouable) {
          var b = el('button', 'exo-btn primaire', 'Jouer la série');
          b.onclick = function () { location.hash = 'defi/' + d.id; };
          l.appendChild(b);
        }
        bloc.appendChild(l);
      });

      /* --- lancer un défi --------------------------------------------- */
      var f = el('div', 'exo-lancer');
      var comps = MathsProgression.jardin(id).filter(function (c) {
        return !c.jamais && c.score >= 35;            // une compétence qu'on tient
      });
      if (!comps.length) {
        f.appendChild(el('p', 'adm-note',
          'Travaille une compétence jusqu\'à la ceinture orange pour pouvoir ' +
          'défier quelqu\'un.'));
        bloc.appendChild(f);
        return bloc;
      }
      var selC = el('select', 'exo-select');
      comps.forEach(function (c) {
        var o = document.createElement('option');
        o.value = c.code; o.textContent = c.libelle;
        selC.appendChild(o);
      });
      var selQ = el('select', 'exo-select');
      autres.forEach(function (p) {
        var o = document.createElement('option');
        o.value = p.id; o.textContent = p.prenom;
        selQ.appendChild(o);
      });
      var mise = el('input', 'exo-champ court');
      mise.type = 'number'; mise.min = 0; mise.value = 10;
      var go = el('button', 'exo-btn', '⚔️ Lancer le défi');
      var msg = el('div', 'adm-note');
      go.onclick = function () {
        var r = MathsDefis.lancer(id, selQ.value, selC.value, mise.value);
        if (!r.ok) { msg.textContent = r.raison; return; }
        rendreAccueil();
      };
      f.appendChild(el('div', 'adm-note',
        'La série sera tirée <b>au palier de celle que tu défies</b>, pas au tien. ' +
        'Si elle fait aussi bien que toi, elle empoche le double de ta mise.'));
      var ligne = el('div', 'exo-lancer-ligne');
      ligne.appendChild(selC); ligne.appendChild(selQ);
      ligne.appendChild(mise); ligne.appendChild(go);
      f.appendChild(ligne);
      f.appendChild(msg);
      bloc.appendChild(f);
      return bloc;
    }

    /* ================================================================= */
    /* L'étagère à trophées : les obtenus en couleur, les autres en       */
    /* filigrane — ils se lisent alors comme des objectifs, ce qui est    */
    /* tout l'intérêt d'un trophée narratif.                              */
    /* ================================================================= */
    function blocTrophees(id) {
      var bloc = el('div', 'exo-trophees-bloc');
      var eus = MathsTrophees.obtenus(id);
      var ids = eus.map(function (t) { return t.id; });
      bloc.appendChild(el('div', 'home-cat',
        'Mes trophées <span class="exo-compte-trophees">' + eus.length + '</span>'));
      var g = el('div', 'exo-trophees');
      eus.forEach(function (t) {
        g.appendChild(el('div', 'exo-trophee',
          '<span class="exo-trophee-emoji">' + t.emoji + '</span>' +
          '<b>' + esc(t.nom) + '</b><span>' + esc(t.desc) + '</span>'));
      });
      MathsTrophees.liste().forEach(function (t) {
        if (ids.indexOf(t.id) >= 0) return;
        g.appendChild(el('div', 'exo-trophee verrouille',
          '<span class="exo-trophee-emoji">' + t.emoji + '</span>' +
          '<b>' + esc(t.nom) + '</b><span>' + esc(t.desc) + '</span>'));
      });
      bloc.appendChild(g);
      return bloc;
    }

    /* ================================================================= */
    /* La boutique (§8) : on ne dépense pas, on DEMANDE.                  */
    /* ================================================================= */
    function rendreBoutique() {
      var id = MathsProfils.courant();
      session.hidden = true;
      accueil.hidden = false;
      accueil.innerHTML = '';
      majBandeau();

      var etat = MathsProfils.etat(id);
      var reg = MathsBoutique.reglages();
      accueil.appendChild(el('div', 'exo-intro',
        '<h2>Boutique</h2>' +
        '<p>Tu as <b>' + (etat.pieces || 0) + ' pièces</b>. Échanger, c\'est ' +
        '<b>demander</b> : tes pièces sont mises de côté, et un parent valide ' +
        '(ou refuse, et tu les récupères).<br>' +
        'Budget du mois restant : <b>' + MathsBoutique.budgetRestant()
          .toFixed(2).replace('.', ',') + ' €</b> — les privilèges, eux, ne ' +
        'coûtent rien et restent toujours disponibles.</p>'));

      var retour = el('button', 'exo-btn', '← Retour');
      retour.onclick = function () { location.hash = 'accueil'; };
      accueil.appendChild(retour);

      var TYPES = [['privilege', 'Privilèges'], ['argent', 'Argent de poche'],
                   ['bon', 'Bons cadeaux']];
      TYPES.forEach(function (t) {
        var arts = MathsBoutique.articles().filter(function (a) { return a.type === t[0]; });
        if (!arts.length) return;
        accueil.appendChild(el('div', 'home-cat', t[1]));
        var g = el('div', 'exo-boutique');
        arts.forEach(function (a) {
          var v = MathsBoutique.peutDemander(id, a.id);
          var c = el('div', 'exo-article' + (v.ok ? '' : ' indispo'));
          c.innerHTML = '<div class="exo-article-nom">' + esc(a.nom) + '</div>' +
            '<div class="exo-article-cout">' + a.cout + ' pièces' +
            (MathsBoutique.eurosDe(a) ? ' · ' + MathsBoutique.eurosDe(a) + ' €' : '') +
            '</div>';
          var b = el('button', 'exo-btn' + (v.ok ? ' primaire' : ''), 'Échanger');
          b.disabled = !v.ok;
          b.onclick = function () {
            var res = MathsBoutique.demander(id, a.id);
            if (res.ok) rendreBoutique();
          };
          c.appendChild(b);
          if (!v.ok) c.appendChild(el('div', 'exo-article-raison', esc(v.raison)));
          g.appendChild(c);
        });
        accueil.appendChild(g);
      });

      /* --- mes demandes ------------------------------------------------ */
      var mes = MathsBoutique.achats(id).slice().reverse();
      accueil.appendChild(el('div', 'home-cat', 'Mes demandes'));
      if (!mes.length) {
        accueil.appendChild(el('p', 'adm-note', 'Aucune demande pour l\'instant.'));
      } else {
        var l = el('div', 'exo-demandes');
        mes.forEach(function (d) {
          var etatTxt = d.statut === 'en-attente' ? '⏳ en attente'
                      : d.statut === 'valide' ? '✅ validée' : '❌ refusée';
          l.appendChild(el('div', 'exo-demande ' + d.statut,
            '<b>' + esc(d.nom) + '</b> <span>' + etatTxt + '</span>' +
            '<div class="adm-note">' + d.cout + ' pièces · ' +
            new Date(d.date).toLocaleDateString('fr-FR') +
            (d.mot ? ' · « ' + esc(d.mot) + ' »' : '') + '</div>'));
        });
        accueil.appendChild(l);
      }
      window.scrollTo(0, 0);
    }

    /* ================================================================= */
    /* Pied de page : le rappel de sauvegarde, et la porte de l'espace    */
    /* parent — où vivent l'export, l'import et le suivi (§7.5, §9).      */
    /* ================================================================= */
    function blocSauvegarde() {
      var jours = MathsProfils.joursDepuisExport();
      var bloc = el('div', 'exo-sauvegarde');
      bloc.innerHTML =
        '<div class="props-label">Sauvegarde</div>' +
        '<p>Toute la progression vit dans ce navigateur : <b>effacer les données ' +
        'du site l\'effacerait aussi</b>. L\'export se fait dans l\'espace parent.</p>' +
        (jours === null
          ? '<p class="exo-rappel">Aucune sauvegarde exportée pour l\'instant.</p>'
          : jours > 30
            ? '<p class="exo-rappel">Dernière sauvegarde il y a ' + jours + ' jours.</p>'
            : '<p class="exo-ok-mini">Dernière sauvegarde il y a ' + jours + ' jour' +
              (jours > 1 ? 's' : '') + '.</p>');
      var act = el('div', 'exo-actions');
      var lien = el('a', 'exo-btn', '🔒 Espace parent');
      lien.href = 'admin.html';
      act.appendChild(lien);
      bloc.appendChild(act);
      return bloc;
    }

    function rendreAccueilOuProfils() {
      if (MathsProfils.courant()) rendreAccueil(); else rendreProfils();
    }

    /* ================================================================= */
    /* Les séries                                                        */
    /* ================================================================= */
    function lancer(ids, titre, nb) {
      accueil.hidden = true;
      session.hidden = false;
      session.innerHTML = '';
      session.appendChild(el('div', 'exo-entete', '<h2>' + esc(titre) + '</h2>'));
      var boite = el('div');
      session.appendChild(boite);
      MathsExos.monter(boite, {
        generateurs: ids, nb: nb || 8, titre: titre,
        profil: MathsProfils.courant(),
        surFin: function () { location.hash = 'accueil'; }
      });
      window.scrollTo(0, 0);
    }

    // Le boss : 10 questions, chronométrées, sans indices, une seule tentative.
    function lancerBoss(ids, titre, chapitre) {
      accueil.hidden = true;
      session.hidden = false;
      session.innerHTML = '';
      session.appendChild(el('div', 'exo-entete',
        '<h2>🛡️ Boss — ' + esc(titre) + '</h2>' +
        '<p class="adm-note">10 questions, chronométrées, <b>sans indice</b> et ' +
        '<b>une seule tentative</b> par question. Il en faut 8 pour valider le ' +
        'chapitre.</p>'));
      var boite = el('div');
      session.appendChild(boite);
      MathsExos.monter(boite, {
        generateurs: ids, nb: 10, mode: 'boss', chapitre: chapitre,
        titre: titre, profil: MathsProfils.courant(),
        surFin: function () { location.hash = 'accueil'; }
      });
      window.scrollTo(0, 0);
    }

    // Le défi : même graine, même palier — les deux joueuses ont exactement la
    // même série.
    function lancerDefi(d) {
      var autre = MathsProfils.profil(d.de === MathsProfils.courant() ? d.vers : d.de);
      accueil.hidden = true;
      session.hidden = false;
      session.innerHTML = '';
      session.appendChild(el('div', 'exo-entete',
        '<h2>⚔️ Défi — ' + esc(MathsExos.competence(d.comp).libelle) + '</h2>' +
        '<p class="adm-note">Contre ' + esc(autre ? autre.prenom : '?') +
        ', mise de ' + d.mise + ' pièces. Même série pour les deux, sans indice.</p>'));
      var boite = el('div');
      session.appendChild(boite);
      MathsExos.monter(boite, {
        generateurs: generateursDe([d.comp]), nb: d.nb, mode: 'defi', defi: d.id,
        graine: d.graine, palierFixe: d.palier, profil: MathsProfils.courant(),
        titre: 'Défi', surFin: function () { location.hash = 'accueil'; }
      });
      window.scrollTo(0, 0);
    }

    function generateursDe(codes) {
      var out = [];
      codes.forEach(function (c) {
        MathsExos.parCompetence(c).forEach(function (g) { out.push(g.id); });
      });
      return out;
    }

    /* ================================================================= */
    /* Routage                                                           */
    /* ================================================================= */
    function router() {
      var h = location.hash.replace(/^#/, '');
      majBandeau();

      if (h === 'profils') { rendreProfils(); return; }
      if (!MathsProfils.courant() || !MathsProfils.profil(MathsProfils.courant())) {
        rendreProfils(); return;
      }

      var m = /^exo\/(.+)$/.exec(h);
      if (m) {
        var g = MathsExos.get(m[1]);
        if (g) { lancer([g.id], g.titre, 8); return; }
      }
      m = /^comp\/(.+)$/.exec(h);
      if (m) {
        var ids = generateursDe([m[1]]);
        if (ids.length) { lancer(ids, MathsExos.competence(m[1]).libelle, 8); return; }
      }
      m = /^chap\/(.+)$/.exec(h);
      if (m) {
        var dedans = MathsExos.liste().filter(function (x) {
          return (MathsExos.competence(x.competence).chapitre || 'autres') === m[1];
        });
        if (dedans.length) {
          lancer(dedans.map(function (x) { return x.id; }),
                 CHAPITRES[m[1]] || m[1], 10);
          return;
        }
      }
      if (h === 'boutique') { rendreBoutique(); return; }

      m = /^boss\/(.+)$/.exec(h);
      if (m) {
        var etatB = MathsProgression.bossEtat(MathsProfils.courant(), m[1]);
        var gensB = [];
        etatB.comps.forEach(function (c) {
          MathsExos.parCompetence(c.code).forEach(function (g) { gensB.push(g.id); });
        });
        if (etatB.ouvert && gensB.length) {
          lancerBoss(gensB, CHAPITRES[m[1]] || m[1], m[1]);
          return;
        }
      }
      m = /^defi\/(.+)$/.exec(h);
      if (m) {
        var d = MathsDefis.trouve(m[1]);
        if (d && d.statut === 'lance') { lancerDefi(d); return; }
      }
      if (h === 'flash' && window.MathsFlash) {
        accueil.hidden = true;
        session.hidden = false;
        session.innerHTML = '';
        session.appendChild(el('div', 'exo-entete',
          '<h2>⚡ Flash — les fondamentaux</h2>' +
          '<p class="adm-note">' + MathsFlash.NB + ' questions. Le chronomètre s\'arrête ' +
          'à ta <b>première frappe</b> : <b>3 points</b> sous 3 secondes, <b>2 points</b> ' +
          'jusqu\'à 6, <b>1 point</b> au-delà. Ce score ne touche ni tes ceintures ni ton ' +
          'jardin — il mesure autre chose.</p>'));
        var boiteFl = el('div');
        session.appendChild(boiteFl);
        MathsFlash.monte(boiteFl, {
          profil: MathsProfils.courant(),
          surFin: function () { location.hash = 'accueil'; }
        });
        window.scrollTo(0, 0);
        return;
      }
      if (h === 'revision') {
        var codes = MathsProgression.aReviser(MathsProfils.courant(), 3);
        var gens = generateursDe(codes);
        if (gens.length) { lancer(gens, 'Arrosage : ' + codes.map(function (c) {
          return MathsExos.competence(c).libelle;
        }).join(', '), 9); return; }
      }
      rendreAccueil();
    }

    window.addEventListener('hashchange', router);

    // On attend la progression du serveur avant de dessiner quoi que ce soit :
    // afficher un jardin vide puis le remplir une seconde plus tard serait pire
    // que d'attendre. Si le serveur ne répond pas, on part sur la copie locale.
    MathsSyncUI.demarre(router);
  })();
  </script>
</body>
</html>
